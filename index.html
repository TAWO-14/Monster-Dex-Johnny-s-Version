<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grimório de Combate</title>
  
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/combat.css">
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1 class="app-title">Grimório de Combate</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="combate" id="tab-btn-combate">Combate</button>
      <button class="tab-btn" data-tab="bestiario" id="tab-btn-bestiario">Bestiário</button>
    </nav>
  </div>
  <div class="header-actions">
    <button class="btn btn-sm btn-ghost" id="btn-export">Exportar backup</button>
    <button class="btn btn-sm btn-ghost" id="btn-import">Importar backup</button>
    <input type="file" id="file-import" accept="application/json" class="hidden">
  </div>
</header>

<main>

  <!-- ===== COMBATE ===== -->
  <section id="tab-combate">
    <div class="combat-toolbar">
      <div class="round-display">Rodada <strong id="round-number">1</strong></div>
      <div class="toolbar-buttons">
        <button class="btn" id="btn-prev-turn">◂ Turno anterior</button>
        <button class="btn btn-primary" id="btn-next-turn">Próximo turno ▸</button>
        <button class="btn" id="btn-toggle-add">+ Adicionar combatente</button>
        <button class="btn btn-ghost" id="btn-clear-combat">Limpar mesa</button>
      </div>
    </div>

    <div class="add-panel hidden" id="add-panel">
      <div class="field"><label>Nome</label><input type="text" id="add-name" class="name-field" placeholder="Ex: Aragorn"></div>
      <div class="field"><label>Iniciativa</label><input type="number" id="add-init" value="10"></div>
      <div class="field"><label>CA</label><input type="number" id="add-ac" value="10"></div>
      <div class="field"><label>PV máximo</label><input type="number" id="add-hp" value="10"></div>
      <div class="field"><label><input type="checkbox" id="add-ispc" checked style="width:auto;vertical-align:middle;"> Personagem jogador</label></div>
      <button class="btn btn-primary" id="btn-confirm-add">Adicionar</button>
    </div>

    <div class="combat-list" id="combat-list"></div>
  </section>

  <!-- ===== BESTIÁRIO ===== -->
  <section id="tab-bestiario" class="hidden">
    <div class="bestiary-toolbar">
      <input type="text" id="search-input" placeholder="Buscar monstro por nome ou tipo...">
      <button class="btn btn-primary" id="btn-new-monster">+ Novo monstro</button>
    </div>
    <div class="bestiary-grid" id="bestiary-grid"></div>
  </section>

  <footer>Os dados ficam salvos neste navegador. Exporte um backup de vez em quando para não perder nada.</footer>
</main>

<!-- ===== MODAL: combatente ===== -->
<div class="modal-overlay" id="combatant-modal-overlay">
  <div class="modal modal-small">
    <div class="modal-header">
      <h2 class="modal-title">Ajustar combatente</h2>
      <button class="btn-icon" data-action="close-combatant-modal" aria-label="Fechar">✕</button>
    </div>
    <div class="form-grid">
      <div class="field field-wide"><label>Nome</label><input type="text" id="ed-name"></div>
      <div class="field"><label>CA</label><input type="number" id="ed-ac"></div>
      <div class="field"><label>PV máximo</label><input type="number" id="ed-hpmax"></div>
      <div class="field"><label>PV atual</label><input type="number" id="ed-hpcur"></div>
      <div class="field"><label>PV temporário</label><input type="number" id="ed-temphp"></div>
      <div class="field"><label style="margin-top:22px;"><input type="checkbox" id="ed-ispc" style="width:auto;vertical-align:middle;"> Personagem jogador</label></div>
      <div class="field"><label style="margin-top:22px;"><input type="checkbox" id="ed-conc" style="width:auto;vertical-align:middle;"> Concentrando</label></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btn-save-combatant">Salvar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: monstro (ver / editar) ===== -->
<div class="modal-overlay" id="monster-modal-overlay">
  <div class="modal" id="monster-modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Ponto de entrada JavaScript usando ES Modules -->
<script type="module" src="js/main.js"></script>

</body>
</html>
